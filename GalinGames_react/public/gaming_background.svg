<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente morado medio -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B4FB8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5FD1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B3FA0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Patron de puntos para textura -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  
  <!-- Mando de videojuego 1 (superior izquierda) -->
  <g opacity="0.15" transform="translate(150, 120)">
    <path d="M 30 50 Q 20 50 20 40 L 20 25 Q 20 15 30 15 L 90 15 Q 100 15 100 25 L 100 40 Q 100 50 90 50 L 75 50 L 70 65 L 50 65 L 45 50 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
    <!-- D-pad -->
    <rect x="32" y="25" width="6" height="18" fill="#7B4FB8"/>
    <rect x="26" y="31" width="18" height="6" fill="#7B4FB8"/>
    <!-- Botones -->
    <circle cx="78" cy="28" r="4" fill="#7B4FB8"/>
    <circle cx="88" cy="34" r="4" fill="#7B4FB8"/>
    <circle cx="78" cy="40" r="4" fill="#7B4FB8"/>
    <circle cx="68" cy="34" r="4" fill="#7B4FB8"/>
    <!-- Joysticks -->
    <circle cx="50" cy="38" r="5" fill="#7B4FB8"/>
    <circle cx="60" cy="28" r="5" fill="#7B4FB8"/>
  </g>
  
  <!-- Consola de videojuegos (superior derecha) -->
  <g opacity="0.16" transform="translate(920, 100)">
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="10" y="10" width="80" height="12" rx="3" fill="#7B4FB8"/>
    <circle cx="110" cy="40" r="12" fill="#7B4FB8"/>
    <circle cx="130" cy="40" r="8" fill="#7B4FB8"/>
    <rect x="10" y="35" width="25" height="8" rx="2" fill="#7B4FB8"/>
    <rect x="10" y="50" width="25" height="8" rx="2" fill="#7B4FB8"/>
    <rect x="10" y="65" width="25" height="8" rx="2" fill="#7B4FB8"/>
    <!-- Ranura disco -->
    <rect x="50" y="30" width="40" height="4" fill="#7B4FB8"/>
    <line x1="95" y1="35" x2="95" y2="75" stroke="#7B4FB8" stroke-width="2"/>
  </g>
  
  <!-- Televisión (centro-izquierda) -->
  <g opacity="0.14" transform="translate(180, 380)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="10" y="10" width="140" height="90" rx="4" fill="#7B4FB8"/>
    <!-- Detalles pantalla -->
    <circle cx="80" cy="55" r="8" fill="#8B5FD1"/>
    <rect x="65" y="45" width="30" height="5" fill="#8B5FD1"/>
    <rect x="65" y="60" width="30" height="5" fill="#8B5FD1"/>
    <!-- Patas -->
    <rect x="30" y="120" width="20" height="25" rx="3" fill="#FFFFFF"/>
    <rect x="110" y="120" width="20" height="25" rx="3" fill="#FFFFFF"/>
    <!-- Antena -->
    <line x1="20" y1="0" x2="10" y2="-30" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="140" y1="0" x2="150" y2="-30" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="10" cy="-30" r="4" fill="#FFFFFF"/>
    <circle cx="150" cy="-30" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- Marcianito 1 (estilo Space Invaders - centro superior) -->
  <g opacity="0.18" transform="translate(520, 180)">
    <rect x="10" y="0" width="10" height="10" fill="#FFFFFF"/>
    <rect x="40" y="0" width="10" height="10" fill="#FFFFFF"/>
    <rect x="20" y="10" width="10" height="10" fill="#FFFFFF"/>
    <rect x="30" y="10" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="20" width="40" height="10" fill="#FFFFFF"/>
    <rect x="0" y="30" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="30" width="10" height="20" fill="#FFFFFF"/>
    <rect x="20" y="30" width="20" height="10" fill="#FFFFFF"/>
    <rect x="40" y="30" width="10" height="20" fill="#FFFFFF"/>
    <rect x="50" y="30" width="10" height="10" fill="#FFFFFF"/>
    <rect x="20" y="50" width="10" height="10" fill="#FFFFFF"/>
    <rect x="30" y="50" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="60" width="10" height="10" fill="#FFFFFF"/>
    <rect x="40" y="60" width="10" height="10" fill="#FFFFFF"/>
  </g>
  
  <!-- Mando 2 (centro-derecha) -->
  <g opacity="0.15" transform="translate(850, 450) rotate(15)">
    <ellipse cx="50" cy="30" rx="50" ry="30" fill="#FFFFFF"/>
    <ellipse cx="30" cy="30" rx="15" ry="20" fill="#FFFFFF"/>
    <ellipse cx="70" cy="30" rx="15" ry="20" fill="#FFFFFF"/>
    <!-- Joystick izquierdo -->
    <circle cx="25" cy="30" r="8" fill="#7B4FB8"/>
    <!-- D-pad derecha -->
    <rect x="64" y="22" width="4" height="16" fill="#7B4FB8"/>
    <rect x="58" y="28" width="16" height="4" fill="#7B4FB8"/>
  </g>
  
  <!-- Marcianito 2 (inferior izquierda) -->
  <g opacity="0.17" transform="translate(280, 600)">
    <rect x="20" y="0" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="10" width="10" height="10" fill="#FFFFFF"/>
    <rect x="20" y="10" width="20" height="10" fill="#FFFFFF"/>
    <rect x="40" y="10" width="10" height="10" fill="#FFFFFF"/>
    <rect x="0" y="20" width="60" height="10" fill="#FFFFFF"/>
    <rect x="0" y="30" width="10" height="20" fill="#FFFFFF"/>
    <rect x="10" y="30" width="10" height="10" fill="#FFFFFF"/>
    <rect x="20" y="40" width="20" height="10" fill="#FFFFFF"/>
    <rect x="40" y="30" width="10" height="10" fill="#FFFFFF"/>
    <rect x="50" y="30" width="10" height="20" fill="#FFFFFF"/>
    <rect x="0" y="50" width="10" height="10" fill="#FFFFFF"/>
    <rect x="50" y="50" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="60" width="10" height="10" fill="#FFFFFF"/>
    <rect x="40" y="60" width="10" height="10" fill="#FFFFFF"/>
  </g>
  
  <!-- Consola portátil (inferior derecha) -->
  <g opacity="0.14" transform="translate(950, 580)">
    <rect x="0" y="0" width="100" height="140" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="10" y="10" width="80" height="60" rx="4" fill="#7B4FB8"/>
    <!-- Controles -->
    <circle cx="25" cy="95" r="12" fill="#7B4FB8"/>
    <rect x="55" y="85" width="8" height="20" fill="#7B4FB8"/>
    <rect x="50" y="90" width="18" height="8" fill="#7B4FB8"/>
    <circle cx="75" cy="95" r="6" fill="#7B4FB8"/>
    <circle cx="85" cy="105" r="6" fill="#7B4FB8"/>
    <rect x="15" y="120" width="70" height="8" rx="2" fill="#7B4FB8"/>
  </g>
  
  <!-- Televisión 2 (centro-bajo) -->
  <g opacity="0.13" transform="translate(550, 580)">
    <rect x="0" y="20" width="120" height="90" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="8" y="28" width="104" height="68" rx="3" fill="#7B4FB8"/>
    <!-- Soporte -->
    <rect x="45" y="110" width="30" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="30" y="118" width="60" height="5" rx="2" fill="#FFFFFF"/>
    <!-- Botones -->
    <circle cx="100" cy="100" r="4" fill="#8B5FD1"/>
    <circle cx="110" cy="100" r="4" fill="#8B5FD1"/>
  </g>
  
  <!-- Marcianito 3 (inferior centro-derecha) -->
  <g opacity="0.16" transform="translate(750, 650)">
    <rect x="10" y="0" width="30" height="10" fill="#FFFFFF"/>
    <rect x="0" y="10" width="50" height="10" fill="#FFFFFF"/>
    <rect x="0" y="20" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="20" width="10" height="20" fill="#FFFFFF"/>
    <rect x="20" y="20" width="10" height="10" fill="#FFFFFF"/>
    <rect x="30" y="20" width="10" height="20" fill="#FFFFFF"/>
    <rect x="40" y="20" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="40" width="10" height="10" fill="#FFFFFF"/>
    <rect x="30" y="40" width="10" height="10" fill="#FFFFFF"/>
  </g>
  
  <!-- Consola clásica (superior centro) -->
  <g opacity="0.15" transform="translate(450, 250)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="10" y="10" width="60" height="40" rx="3" fill="#7B4FB8"/>
    <circle cx="90" cy="25" r="10" fill="#7B4FB8"/>
    <circle cx="90" cy="45" r="10" fill="#7B4FB8"/>
    <rect x="10" y="55" width="35" height="8" rx="2" fill="#7B4FB8"/>
    <rect x="75" y="55" width="35" height="8" rx="2" fill="#7B4FB8"/>
  </g>
</svg>